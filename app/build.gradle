plugins {
    id 'com.android.application'
}

android {
    /*
    signingConfigs {
        release {
            storeFile file('/home/tony/TAF/APPS/BookPlayer ressources/keystore/bbb.jks')
            storePassword '****'
            keyAlias 'key0'
            keyPassword '****'
        }
    }

     */
    compileSdkVersion 34 // compile version 34 where target version is only 33,  for implementation 'androidx.core:core:1.12.0' to work

    defaultConfig {
        applicationId "com.driot.bookplayer"
        minSdkVersion 26 //  23 = android 6.0 Marshmallow 2015 // 26 = android 8.0 - Oreo - 2017
        targetSdkVersion 34 //31-32 =  = android 11.0       //  30 = android 11.0

        versionCode 26
        versionName "26 - single file fix"
        //versionName "25 - LockedPhoneNotification"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        signingConfig signingConfigs.debug

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }
    buildTypes {
        release {
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled false

            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources false

            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            //signingConfig signingConfigs.release
            //debuggable true
        }

    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}

configurations.implementation {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'  // to avoid error : Duplicate class kotlin....found in modules jetified-kotlin-stdlib-1.8.10 (org.jetbrains.kotlin:kotlin-stdlib:1.8.10) and jetified-kotlin-stdlib-jdk8-1.7.20 (org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.7.20)
}

dependencies {

    implementation 'org.apache.commons:commons-io:1.3.2'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.google.android.play:core:1.10.3'
    implementation project(path: ':tonyLib')

    //implementation 'com.nbsp:library:filepicker:2.4.1'
    //implementation 'com.nbsp:library:filepicker:1.2.1'
    //implementation 'com.github.arteaprogramar:Android_MaterialFilePicker:1.0.0'
    //implementation 'com.nabinbhandari.android:filepicker:2.2.2'

    //implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.google.android.material:material:1.9.0' //snackBar, recyclerView
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.media:media:1.6.0'
    implementation 'androidx.annotation:annotation:1.7.0'
//    implementation 'androidx.activity:activity:1.7.2' //permissions
//    implementation 'androidx.fragment:fragment:1.6.1' //permissions

    implementation "androidx.room:room-runtime:2.5.2"
    annotationProcessor "androidx.room:room-compiler:2.5.2"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}