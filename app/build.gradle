plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {

    compileSdk 35 // Previous Note : compile version 34 where target version is only 33,  for implementation 'androidx.core:core:1.12.0' to work

    defaultConfig {
        applicationId "com.driot.bookplayer"

        //  16   = android 4.1 Jelly Bean    2012
        //  19   = android 4.4 KitKat        2013       --> support dropped 2023 (Play store hs)
        //  21   = android 5.0 Lollipop      2014       --> google app are not updated since 2021...
        //  23   = android 6.0 Marshmallow   2015
        //  24   = android 7.0 Nougat        2016 <-------------------------------- Bookplayer OK
        //  26   = android 8.0 Oreo          2017   VERSION_CODES.O      <--------- Main test article (Huawei), OK
        //  28   = android 9.0
        //  30   = android 11.0
        // 31-32 = android 12.0
        //  33   = android 13.0 Tiramisu
        //  34   = android 14.0 Upside Down Cake        2023
        //  35   = android 15.0 Vanilla Ice Cream       2025

        minSdkVersion 24
        //24 seems to be minimum for ZipFile
        //note : 26 needed for special mediaPlayer.seekTo (m4b)
        //note : 26 needed for NotificationChannel
        //note : 26 needed for xml adaptable icons

        //note : 26 needed for paddingHorizontal in xml files   ====> maybe it is why it does not work on android 7 ?

        targetSdkVersion 35

        /////////////////////////////////////////////////////////////////////////
        /////////////////////////////////////////////////////////////////////////
        versionCode 140
        versionName "140 - Magic Unicorn"
        /////////////////////////////////////////////////////////////////////////
        /////////////////////////////////////////////////////////////////////////

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        signingConfig signingConfigs.debug

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        androidResources {
            generateLocaleConfig = true
        }

    }
/*
    signingConfigs {
        release {
            //storeFile file('/home/tony/TAF/APPS/BookPlayer ressources/keystore/bbb.jks')
            //storeFile file('C:/Users/adrio/StudioProjects/keystore/ccc.jks')
            storeFile file('C:/Users/adrio/StudioProjects/BookPlayer ressources/keystore/bbb.jks')
            storePassword '****'
            keyAlias 'key0'
            keyPassword '****'
        }
    }
*/
    buildTypes {
        release {
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled false

            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources false

//            proguardFiles getDefaultProguardFile(
//                    'proguard-android-optimize.txt'),
//                    'proguard-rules.pro'

            //signingConfig signingConfigs.release
            //debuggable true
        }

    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.driot.bookplayer'

}

configurations.implementation {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'  // to avoid error : Duplicate class kotlin....found in modules jetified-kotlin-stdlib-1.8.10 (org.jetbrains.kotlin:kotlin-stdlib:1.8.10) and jetified-kotlin-stdlib-jdk8-1.7.20 (org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.7.20)
}

dependencies {

    implementation 'org.apache.commons:commons-io:1.3.2'
    implementation 'com.google.android.material:material:1.12.0' //snackBar, recyclerView, actionBar?  => update to 1.10 breaks Observer and LifecycleOwner
    // => so try to import only snack-bar and recycler view.... or from there better ? :  implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.core:core:1.16.0' //needs sdk 36
    implementation 'androidx.media:media:1.7.1'
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation "androidx.room:room-runtime:2.7.2"
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    implementation 'com.google.android.gms:play-services-nearby:19.3.0'

    implementation 'com.google.code.gson:gson:2.11.0'

    implementation 'com.google.firebase:firebase-crashlytics:20.0.0'

    implementation platform('com.google.firebase:firebase-bom:34.1.0')
    implementation 'com.google.firebase:firebase-analytics'


// for storing PlayList Serializable in prefs

    annotationProcessor "androidx.room:room-compiler:2.7.2"

    implementation 'com.googlecode.mp4parser:isoparser:1.1.22'

    //implementation 'com.google.android.play:app-update:2.1.0'   => TODO Next thing to do !


    // For Librivox integration :
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.3'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    implementation "androidx.work:work-runtime:2.10.3"


