plugins {
    id 'com.android.application'
}

android {

    compileSdk 34 // Previous Note : compile version 34 where target version is only 33,  for implementation 'androidx.core:core:1.12.0' to work

    defaultConfig {
        applicationId "com.driot.bookplayer"

        //  16   = android 4.1 Jelly Bean    2012
        //  21   = android 5.0 Lollipop      2014
        //  23   = android 6.0 Marshmallow   2015
        //  24   = android 7.0 Nougat        2016 <--------------
        //  26   = android 8.0 Oreo          2017   VERSION_CODES.O
        //  30   = android 11.0
        // 31-32 = android 12.0
        //  33   = android 13.0 Tiramisu

        minSdkVersion 26
        //24 seems to be minimum for ZipFile
        //note : 26 needed for special mediaPlayer.seekTo (m4b)
        //note : 26 needed for NotificationChannel
        //note : 26 needed for xml adaptable icons

        targetSdkVersion 34

        /////////////////////////////////////////////////////////////////////////
        /////////////////////////////////////////////////////////////////////////
        versionCode 44
        versionName "44 - Big Update"
        /////////////////////////////////////////////////////////////////////////
        /////////////////////////////////////////////////////////////////////////

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        signingConfig signingConfigs.debug

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        androidResources {
            generateLocaleConfig = true
        }

    }
