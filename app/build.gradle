plugins {
    id 'com.android.application'
}

android {

    compileSdk 35 // Previous Note : compile version 34 where target version is only 33,  for implementation 'androidx.core:core:1.12.0' to work

    defaultConfig {
        applicationId "com.driot.bookplayer"

        //  16   = android 4.1 Jelly Bean    2012
        //  19   = android 4.4 KitKat        2013       --> support dropped 2023 (Play store hs)
        //  21   = android 5.0 Lollipop      2014       --> google app are not updated since 2021...
        //  23   = android 6.0 Marshmallow   2015
        //  24   = android 7.0 Nougat        2016 <-------------------------------- Bookplayer OK
        //  26   = android 8.0 Oreo          2017   VERSION_CODES.O      <--------- Main test article (Huawei), OK
        //  28   = android 9.0
        //  30   = android 11.0
        // 31-32 = android 12.0
        //  33   = android 13.0 Tiramisu
        //  34   = android 14.0 Upside Down Cake        2023
        //  35   = android 15.0 Vanilla Ice Cream       2025

        minSdkVersion 24
        //24 seems to be minimum for ZipFile
        //note : 26 needed for special mediaPlayer.seekTo (m4b)
        //note : 26 needed for NotificationChannel
        //note : 26 needed for xml adaptable icons

        targetSdkVersion 35

        /////////////////////////////////////////////////////////////////////////
        /////////////////////////////////////////////////////////////////////////
        versionCode 59
        versionName "59 - forum link added"
        /////////////////////////////////////////////////////////////////////////
        /////////////////////////////////////////////////////////////////////////

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        signingConfig signingConfigs.debug

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        androidResources {
            generateLocaleConfig = true
        }

        // Custom FFMPEG Stuff
        externalNativeBuild {
            cmake {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
            }
        }
        ndk {
            // Si tu veux définir une version spécifique :
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }
    
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

